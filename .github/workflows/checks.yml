name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfido2-dev libudev-dev libssl-dev libpam0g-dev dbus openssh-client gnupg pkg-config clang
      - name: Check formatting and unit tests
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt --toolchain stable
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --locked
          python3 scripts/check-build-output.py
          node --test tests/*.test.cjs
          python3 scripts/sync-i18n.py --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          for script in install.sh scripts/install-plugins.sh scripts/build-pam-gate.sh luks/zzzz-omarchy-yubikey-luks.conf; do
            bash -n "$script"
          done
      - name: Check publication content
        run: python3 scripts/check-publication.py
      - name: Scan source and history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scan_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" dir . --redact --no-banner
          "$scan_dir/gitleaks" git . --redact --no-banner
